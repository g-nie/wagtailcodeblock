[tox]
envlist =
    ; Django 5.2 LTS, supported Wagtail versions (LTS + latest)
    py{310,311,312,313}-dj52-wt{71,73}
    ; Django 6.0, supported Wagtail versions (Django 6.0 support was added in Wagtail 7.3)
    py{312,313,314}-dj60-{wt73,wt74}

[testenv]
setenv =
    COVERAGE_FILE=.coverage.{envname}
    PYTHONWARNINGS=always::DeprecationWarning
extras = dev

basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14

deps =
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    wt71: wagtail>=7.1,<7.2
    wt73: wagtail>=7.3,<7.4
    wt74: wagtail>=7.4rc1,<7.5

commands =
    coverage run -m pytest -o addopts=--reuse-db {posargs}

[testenv:future]
basepython = python3.14
setenv =
    PYTHONWARNINGS=always::DeprecationWarning
commands_pre =
    ; Test compatibility with development versions of Django and Wagtail
    ; no-deps necessary to stop pip from complaining about incompatible versions
    pip install -U --no-deps \
    https://github.com/django/django/archive/refs/heads/main.zip \
    https://github.com/wagtail/wagtail/archive/refs/heads/main.zip
    pip freeze
extras = dev
commands =
    pytest -o addopts=--reuse-db {posargs}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
